x-app-env: &app-env
  DATABASE_URL: "postgresql://${POSTGRES_USER:-dinesense}:${POSTGRES_PASSWORD:-dinesense}@db:5432/${POSTGRES_DB:-dinesense}?schema=public"
  SESSION_SECRET: "${SESSION_SECRET:-dev-session-secret-change-me}"
  ENCRYPTION_KEY: "${ENCRYPTION_KEY:-dev-encryption-key-change-me}"
  VISION_SHARED_SECRET: "${VISION_SHARED_SECRET:-dev-vision-secret}"
  ENABLE_DEV_CONSOLE: "${ENABLE_DEV_CONSOLE:-false}"
  NEXT_PUBLIC_ENABLE_DEV_UI: "${NEXT_PUBLIC_ENABLE_DEV_UI:-false}"
  DEMO_ALLOW_ALL_ROLES: "${DEMO_ALLOW_ALL_ROLES:-false}"
  COOKIE_SECURE: "${COOKIE_SECURE:-false}"
  VISION_URL: "http://vision:8100"

x-app: &app
  image: dinesense:local
  build:
    context: .
    dockerfile: Dockerfile
  environment: *app-env
  restart: unless-stopped

services:
  db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-dinesense}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-dinesense}"
      POSTGRES_DB: "${POSTGRES_DB:-dinesense}"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dinesense} -d ${POSTGRES_DB:-dinesense}"]
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
      - "5432:5432"

  migrate:
    <<: *app
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command:
      ["npx", "prisma", "migrate", "deploy", "--schema", "packages/db/prisma/schema.prisma"]

  web:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    volumes:
      - ./backups:/backups:ro
    healthcheck:
      test:
        - "CMD-SHELL"
        - "node -e \"fetch('http://127.0.0.1:3000/api/health').then(() => process.exit(0)).catch(() => process.exit(1))\""
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["npm", "run", "start", "-w", "@dinesense/worker"]

  vision:
    image: dinesense-vision:local
    build:
      context: ./services/vision
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      API_BASE_URL: "http://web:3000"
      VISION_SHARED_SECRET: "${VISION_SHARED_SECRET:-dev-vision-secret}"
      ZONES_FILE: "/data/zones.json"
      TUNING_LOG_PATH: "/data/tuning.csv"
      VISION_DEMO: "${VISION_DEMO:-false}"
      VISION_FORCE_FILE: "${VISION_FORCE_FILE:-false}"
      YOLO_MODEL: "${YOLO_MODEL:-yolo11n.pt}"
      YOLO_CONF: "${YOLO_CONF:-0.35}"
      SNAPSHOT_FPS: "${SNAPSHOT_FPS:-1}"
    volumes:
      - ./services/vision/demo:/data
    ports:
      - "127.0.0.1:8100:8100"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-localhost}"
      ACME_EMAIL: "${ACME_EMAIL:-}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
